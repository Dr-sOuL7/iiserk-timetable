<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IISER-K Timetable</title>
<meta name="description" content="Offline personal class timetable for IISER Kolkata - pick your courses once, then see what's on today.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timetable">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= Course selection ================= -->
<section id="screen-setup" class="screen" hidden>
  <header class="setup-head">
    <div class="setup-head-row">
      <div>
        <h1 id="setup-title">Choose your courses</h1>
        <p class="sub" id="setup-sub">Pick the courses you are registered for. You can change this later.</p>
      </div>
      <button type="button" id="setup-cancel" class="icon-btn" hidden aria-label="Cancel and go back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input type="search" id="search" placeholder="Search code or course name" autocomplete="off"
             autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Search courses">
      <button type="button" id="search-clear" class="clear-btn" hidden aria-label="Clear search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="chips" id="dept-chips" role="tablist" aria-label="Filter by department"></div>
  </header>

  <div class="setup-list" id="course-list"></div>

  <footer class="setup-foot">
    <div class="foot-count">
      <strong id="sel-count">0 selected</strong>
      <button type="button" id="clear-sel" class="link-btn" hidden>Clear all</button>
    </div>
    <button type="button" id="continue-btn" class="primary-btn">Continue</button>
  </footer>
</section>

<!-- ================= Timetable ================= -->
<section id="screen-app" class="screen" hidden>
  <header class="app-bar">
    <div class="app-bar-text">
      <h1>My Timetable</h1>
      <p class="sub" id="semester-label"></p>
    </div>
    <button type="button" id="open-settings" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="main">
    <!-- Today -->
    <div id="view-today" class="view">
      <p class="date-line" id="date-line"></p>
      <div id="now-card"></div>
      <div id="midsem-card"></div>
      <h2 class="section-head" id="today-head">Today</h2>
      <div id="today-list" class="event-list"></div>
    </div>

    <!-- Week -->
    <div id="view-week" class="view" hidden>
      <div class="chips day-chips" id="day-chips" role="tablist" aria-label="Choose a day"></div>
      <div id="week-list" class="event-list"></div>
    </div>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Views">
    <button type="button" class="tab" data-view="today" role="tab" aria-selected="true">
      <span class="tab-ind"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span>Today</span>
    </button>
    <button type="button" class="tab" data-view="week" role="tab" aria-selected="false">
      <span class="tab-ind"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <span>Week</span>
    </button>
  </nav>
</section>

<!-- ================= Settings sheet ================= -->
<div id="sheet-backdrop" class="backdrop" hidden></div>
<aside id="settings-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <h2 id="settings-title">Settings</h2>

  <div class="setting-row">
    <span>Appearance</span>
    <div class="segmented" id="theme-seg" role="group" aria-label="Appearance">
      <button type="button" data-theme="auto">Auto</button>
      <button type="button" data-theme="light">Light</button>
      <button type="button" data-theme="dark">Dark</button>
    </div>
  </div>

  <button type="button" id="change-courses" class="sheet-btn">
    <span>
      <strong>Change courses</strong>
      <small id="course-summary"></small>
    </span>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="chev"><path d="m9 6 6 6-6 6"/></svg>
  </button>

  <p class="sheet-label">Start over</p>
  <div class="sheet-group">
    <button type="button" id="reset-changes-btn" class="sheet-btn" hidden>
      <span>
        <strong>Reset timetable changes</strong>
        <small id="changes-summary"></small>
      </span>
    </button>

    <button type="button" id="reset-midsem-btn" class="sheet-btn" hidden>
      <span>
        <strong>Reset Mid-Sem edits</strong>
        <small id="midsem-changes-summary"></small>
      </span>
    </button>

    <button type="button" id="reset-btn" class="sheet-btn danger">
      <span>
        <strong>Reset courses</strong>
        <small>Clear saved courses and return to the picker</small>
      </span>
    </button>
  </div>

  <p class="sheet-foot" id="sheet-foot"></p>
  <button type="button" id="close-settings" class="ghost-btn">Close</button>
</aside>

<!-- ================= Confirm dialog ================= -->
<div id="confirm-backdrop" class="backdrop" hidden></div>
<div id="confirm-dialog" class="modal" role="alertdialog" aria-modal="true"
     aria-labelledby="confirm-title" aria-describedby="confirm-body" hidden>
  <h2 id="confirm-title"></h2>
  <p id="confirm-body"></p>
  <div class="modal-actions">
    <button type="button" id="confirm-cancel" class="ghost-btn">Cancel</button>
    <button type="button" id="confirm-ok" class="danger-btn">Reset</button>
  </div>
</div>

<!-- ================= Single-event action sheet ================= -->
<div id="event-backdrop" class="backdrop" hidden></div>
<aside id="event-sheet" class="sheet" role="dialog" aria-modal="true"
       aria-labelledby="event-sheet-title" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <h2 id="event-sheet-title">Class</h2>
  <p class="sheet-sub" id="event-sheet-sub"></p>

  <button type="button" id="event-edit" class="sheet-btn">
    <span>
      <strong>Edit</strong>
      <small>Change the day, time, course, type or room</small>
    </span>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="chev"><path d="m9 6 6 6-6 6"/></svg>
  </button>

  <button type="button" id="event-restore" class="sheet-btn" hidden>
    <span>
      <strong>Undo my changes</strong>
      <small>Restore this class to the published timetable</small>
    </span>
  </button>

  <button type="button" id="event-remove" class="sheet-btn danger">
    <span>
      <strong>Remove</strong>
      <small>Hide only this class - the course stays selected</small>
    </span>
  </button>

  <button type="button" id="event-close" class="ghost-btn">Cancel</button>
</aside>

<!-- ================= Edit event dialog ================= -->
<div id="edit-backdrop" class="backdrop" hidden></div>
<aside id="edit-sheet" class="sheet" role="dialog" aria-modal="true"
       aria-labelledby="edit-title" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <h2 id="edit-title">Edit class</h2>
  <p class="sheet-sub" id="edit-sub"></p>

  <form id="edit-form" novalidate>
    <div class="field-row">
      <label class="field">
        <span>Day</span>
        <select id="f-day"></select>
      </label>
      <label class="field">
        <span>Start time</span>
        <input type="time" id="f-time" required>
      </label>
    </div>

    <label class="field">
      <span>Course code</span>
      <input type="text" id="f-course" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" required>
    </label>

    <label class="field">
      <span>Course name</span>
      <input type="text" id="f-name" autocomplete="off">
    </label>

    <div class="field-row">
      <label class="field">
        <span>Type</span>
        <select id="f-type">
          <option value="Theory">Theory</option>
          <option value="Tutorial">Tutorial</option>
          <option value="Lab">Lab</option>
        </select>
      </label>
      <label class="field">
        <span>Duration (min)</span>
        <input type="number" id="f-duration" inputmode="numeric" min="5" max="600" required>
      </label>
    </div>

    <label class="field">
      <span>Room</span>
      <input type="text" id="f-room" autocomplete="off">
    </label>

    <p class="field-error" id="edit-error" hidden></p>

    <div class="modal-actions">
      <button type="button" id="edit-cancel" class="ghost-btn">Cancel</button>
      <button type="submit" id="edit-save" class="primary-btn wide">Save changes</button>
    </div>
  </form>
</aside>

<!-- ================= Mid-Sem full schedule ================= -->
<div id="midsem-backdrop" class="backdrop" hidden></div>
<aside id="midsem-sheet" class="sheet" role="dialog" aria-modal="true"
       aria-labelledby="midsem-sheet-title" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <h2 id="midsem-sheet-title">Mid-Sem schedule</h2>
  <p class="sheet-sub" id="midsem-sheet-sub"></p>

  <div id="midsem-list" class="event-list midsem-list"></div>

  <button type="button" id="midsem-close" class="ghost-btn">Close</button>
</aside>

<!-- ================= Edit Mid-Sem exam ================= -->
<div id="midsem-edit-backdrop" class="backdrop" hidden></div>
<aside id="midsem-edit-sheet" class="sheet" role="dialog" aria-modal="true"
       aria-labelledby="midsem-edit-title" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <h2 id="midsem-edit-title">Edit exam</h2>
  <p class="sheet-sub" id="midsem-edit-sub"></p>

  <form id="midsem-edit-form" novalidate>
    <div class="field-row">
      <label class="field">
        <span>Date</span>
        <input type="date" id="me-date" required>
      </label>
      <label class="field">
        <span>Start time</span>
        <input type="time" id="me-time" required>
      </label>
    </div>

    <label class="field">
      <span>Venue</span>
      <input type="text" id="me-venue" autocomplete="off" required>
    </label>

    <p class="field-error" id="midsem-edit-error" hidden></p>

    <div class="modal-actions">
      <button type="button" id="midsem-edit-cancel" class="ghost-btn">Cancel</button>
      <button type="submit" id="midsem-edit-save" class="primary-btn wide">Save changes</button>
    </div>
  </form>
</aside>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="data/timetable.js"></script>
<script src="data/holidays.js"></script>
<script src="data/midsem.js"></script>
<script src="app.js"></script>
</body>
</html>
